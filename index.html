    rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'SF Mono', 'Menlo', 'Consolas', 'Liberation Mono', 'monospace'],
          },
          colors: {
            gh: {
              bg: 'var(--color-bg)',
              canvas: 'var(--color-canvas)',
              card: 'var(--color-card)',
              header: 'var(--color-header)',
              border: 'var(--color-border)',
              borderActive: 'var(--color-border-active)',
              text: 'var(--color-text)',
              muted: 'var(--color-muted)',
              link: 'var(--color-link)',
              btn: 'var(--color-btn)',
              success: 'var(--color-success)',
              attention: 'var(--color-attention)',
              danger: 'var(--color-danger)',
              'code-bg': 'var(--color-code-bg)',
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      /* Light Mode Theme (Clean & Crisp) */
      --color-bg: #FFFFFF;
      --color-canvas: #F5F5F5;
      --color-card: #FFFFFF;
      --color-header: #FFFFFF;
      --color-border: #E0E0E0;
      --color-border-active: #4f46e5;
      --color-text: #000000;
      --color-muted: #666666;
      --color-link: #2563eb;
      --color-btn: #F5F5F5;
      --color-success: #16a34a;
      --color-attention: #d97706;
      --color-danger: #dc2626;
      --color-code-bg: #1E1E1E;
    }

    .dark {
      color-scheme: dark;
      /* Dark Mode Theme (High Contrast & Depth) */
      --color-bg: #121212;
      --color-canvas: #1E1E1E;
      --color-card: #1E1E1E;
      --color-header: #1E1E1E;
      --color-border: #333333;
      --color-border-active: #818cf8;
      --color-text: #FFFFFF;
      --color-muted: #B0B0B0;
      --color-link: #60a5fa;
      --color-btn: #2C2C2C;
      --color-success: #34d399;
      --color-attention: #fbbf24;
      --color-danger: #fb7185;
      --color-code-bg: #000000;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: var(--color-border);
      border-radius: 99px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: var(--color-border-active);
    }
  </style>
  <script type="importmap">
