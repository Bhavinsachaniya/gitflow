    rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'SF Mono', 'Menlo', 'Consolas', 'Liberation Mono', 'monospace'],
          },
          colors: {
            gh: {
              bg: 'var(--canvas-default)',
              canvas: 'var(--canvas-subtle)',
              card: 'var(--surface-card)',
              header: 'var(--canvas-subtle)',
              border: 'var(--border-default)',
              borderSubtle: 'var(--border-muted)',
              borderActive: 'var(--border-active)',
              text: 'var(--fg-default)',
              muted: 'var(--fg-muted)',
              subtle: 'var(--fg-subtle)',
              link: 'var(--accent-fg)',
              btn: 'var(--canvas-inset)',
              success: 'var(--success-fg)',
              successEmphasis: 'var(--success-emphasis)',
              attention: 'var(--attention-fg)',
              danger: 'var(--danger-fg)',
              'code-bg': 'var(--code-bg)',
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      /* GitHub Primer Light Theme */
      --canvas-default: #FFFFFF;
      --canvas-subtle: #F6F8FA;
      --canvas-inset: #EFF2F5;
      --surface-card: #FFFFFF;

      --fg-default: #1F2328;
      --fg-muted: #424A53;
      --fg-subtle: #59636E;
      --fg-on-emphasis: #FFFFFF;

      --border-default: #D1D9E0;
      --border-muted: #D8DEE4;
      --border-active: #0969DA;

      --accent-fg: #0969DA;
      --accent-emphasis: #0550AE;

      --success-fg: #1A7F37;
      --success-emphasis: #1F883D;

      --danger-fg: #CF222E;
      --attention-fg: #9A6700;
      --code-bg: #161B22;
    }

    .dark {
      color-scheme: dark;
      /* GitHub Primer Dark Theme */
      --canvas-default: #0D1117;
      --canvas-subtle: #161B22;
      --canvas-inset: #21262D;
      --surface-card: #161B22;

      --fg-default: #F0F6FC;
      --fg-muted: #C9D1D9;
      --fg-subtle: #8B949E;
      --fg-on-emphasis: #FFFFFF;

      --border-default: #30363D;
      --border-muted: #21262D;
      --border-active: #58A6FF;

      --accent-fg: #58A6FF;
      --accent-emphasis: #1F6FEB;

      --success-fg: #3FB950;
      --success-emphasis: #238636;

      --danger-fg: #F85149;
      --attention-fg: #D29922;
      --code-bg: #0D1117;
    }

    body {
      background-color: var(--canvas-default);
      color: var(--fg-default);
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: var(--color-border);
      border-radius: 99px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: var(--color-border-active);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
